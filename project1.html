<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Cloud Auth</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { color: #333; margin-bottom: 20px; font-weight: 500; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #error-msg { color: #d9534f; font-size: 14px; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-card" id="login-container">
        <h2>Corporate Login</h2>
        <p id="error-msg">Invalid credentials. Please try again.</p>
        <input type="text" id="username" placeholder="Employee ID or Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="handleLogin()">Sign In</button>
    </div>

    <script src="honeypot.js"></script>
</body>
</html>
